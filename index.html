    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="THE COLLECTION · nineteen destination websites built against machine-default design. One series, nineteen places, zero templates." />
    <meta name="theme-color" content="#0B0B0D" />
    <meta property="og:title" content="THE COLLECTION · Nineteen Places" />

    />
    <title>THE COLLECTION · Nineteen Places</title>
    <script>
      try {
        var t = localStorage.getItem("collection-theme");
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
