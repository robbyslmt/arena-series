tak Sembilan after the ice has been broken. The camera stays at chest height. I do not climb for the wide view. The wide view is a tourist's comfort.",frames:[Z({pexelsId:5939248,id:"pasar-01",frameNo:"04A",alt:"Representative work. Figure crossing a street market in morning light.",orientation:"landscape",ground:"Street approach, early",film:"Tri-X 400",aperture:"f/5.6",credit:"Jizo Photo",creditUrl:"https://www.pexels.com/@jizo-photo-1804779",note:"The first useful frame is rarely inside. It is the approach: a body cutting the light at the mouth of the pasar, still deciding whether to enter. I wait for the stride to break, not for a face."}),Z({pexelsId:29462825,id:"pasar-02",frameNo:"09A",alt:"Representative work. Aisles of an indoor market with figures moving between stalls.",orientation:"landscape",ground:"Atrium corridor",film:"Tri-X 400",aperture:"f/4",credit:"Owen.outdoors",creditUrl:"https://www.pexels.com/@owen-outdoors-409204690",note:"Tanah Abang has an atrium that behaves like a well. Midmorning the light drops in a square and the rest of the floor stays in soup. I meter for the soup. The square can blow. People walk through both without changing speed."}),Z({pexelsId:37377178,id:"pasar-03",frameNo:"12A",alt:"Representative work. Crowded fish stall, hands and ice.",orientation:"landscape",ground:"Wet aisle",film:"Tri-X 400",aperture:"f/4",credit:"Mido Makasardi",creditUrl:"https://www.pexels.com/@mjlo",note:"Ice is a clock. When it is still in blocks, the stall is setting up. When it is slurry, the buying is serious. I photograph the slurry. The smell does the rest of the work the print cannot."}),Z({pexelsId:37457816,id:"pasar-04",frameNo:"16A",alt:"Representative work. Street food stall with vendors and customers.",orientation:"landscape",ground:"Warung edge",film:"Tri-X 400",aperture:"f/2.8",credit:"Mico Medel",creditUrl:"https://www.pexels.com/@micomedel",note:"A warung at the edge of a pasar is a hinge between eating and selling. Steam reads as fog on Tri-X. I expose for the face behind the pot, then let the steam take the highlights. Patience is standing still while the ladle comes up."}),Z({pexelsId:8476914,id:"pasar-05",frameNo:"19A",alt:"Representative work. A woman pushing a cart through vendor stalls.",orientation:"landscape",ground:"Service lane",film:"Tri-X 400",aperture:"f/5.6",credit:"Sergey Meshkov",creditUrl:"https://www.pexels.com/@19x14",note:"The service lane is more honest than the front of the stall. Carts, empties, the person who keeps the aisle from choking. I follow the cart for half a minute and make one frame when a shoulder turns."}),Z({pexelsId:33582974,id:"pasar-06",frameNo:"22A",alt:"Representative work. Textile shop front with hanging cloth.",orientation:"portrait",ground:"Cloth street",film:"Tri-X 400",aperture:"f/8",credit:"MAG Photography",creditUrl:"https://www.pexels.com/@mag-photography-1501456",note:"Pasar Baru keeps its cloth in the doorway so the street becomes a dressing room. Folded goods make verticals. I stop down to hold the pattern. A man sits because the day is long, not for the picture."}),Z({pexelsId:20296417,id:"pasar-07",frameNo:"25A",alt:"Representative work. Vendor working under a canopy of hanging bulbs.",orientation:"portrait",ground:"Bulb canopy",film:"Tri-X 400",aperture:"f/2.8",credit:"Yoda",creditUrl:"https://www.pexels.com/@yoda-497072362",note:"Bare bulbs are the ceiling of a certain kind of Jakarta. They make a constellation that has nothing to do with night. I stand until the vendor forgets the camera and returns to the scale."}),Z({pexelsId:37252488,id:"pasar-08",frameNo:"28A",alt:"Representative work. Portrait of an elderly market vendor.",orientation:"portrait",ground:"Stall portrait",film:"Tri-X 400",aperture:"f/2.8",credit:"Daneswara Eka",creditUrl:"https://www.pexels.com/@daneswara-eka-2157956675",note:"I do not ask for portraits in the first year. In the third year a vendor will nod at the camera the way he nods at a regular. That is the frame. The snack packets behind him do more work than any backdrop I could choose."}),Z({pexelsId:32011133,id:"pasar-09",frameNo:"31A",alt:"Representative work. Hands arranging produce at an outdoor stall.",orientation:"landscape",ground:"Produce table",film:"Tri-X 400",aperture:"f/4",credit:"Kaue Barbier",creditUrl:"https://www.pexels.com/@kaue-barbier-710715348",note:"Hands tell the hour. Morning hands stack. Noon hands weigh. Late hands sweep what will not keep. I photograph the stacking. It is the most tender work in a pasar and the least performed."}),Z({pexelsId:30883977,id:"pasar-10",frameNo:"35A",alt:"Representative work. Night stall, a woman serving food.",orientation:"landscape",ground:"After dark, edge stall",film:"Tri-X 400",aperture:"f/2",credit:"Tuan Vy",creditUrl:"https://www.pexels.com/@tuan-vy-903011268",note:"Pasar Kue Subuh in Senen starts when the rest of the city is trying to sleep. I have never liked the word night market. This is a morning that begins too early. The print should feel slightly underexposed, like a person who has not yet decided to be awake."})]},{id:"kali",rollNo:"R-0207",title:"Kali",indonesian:"kali",translation:"river, canal",stock:"Ilford HP5 Plus",intro:"Jakarta is a city of kali. Ciliwung, Krukut, Sunter, Item. Some have been walled in concrete under the name of normalization. Some still hold houses on their banks, laundry in their air, children who know the water by color. I walk the corridors the way a biologist walks a transect: same path, wet season and dry, counting what remains.",sleeve:"HP5 for the mud. The river is already a gray. Color would only argue with it. Notes written the same evening, before the humidity takes the paper. I do not print faces from the first visits. Access is a season, not a permission slip.",frames:[Z({pexelsId:5375673,id:"kali-01",frameNo:"02A",alt:"Representative work. Houses crowding a riverbank.",orientation:"landscape",ground:"Bank settlement",film:"HP5 400",aperture:"f/8",credit:"Tom Fisk",creditUrl:"https://www.pexels.com/@tomfisk",note:"From a distance the houses look like they grew from the water. Up close they are decisions: a plank, a drum, a roof sheet held with wire. I keep the horizon high so the river has weight. The city beyond is a rumor."}),Z({pexelsId:18659289,id:"kali-02",frameNo:"07A",alt:"Representative work. Quiet urban river with trees and path.",orientation:"landscape",ground:"Service path",film:"HP5 400",aperture:"f/8",credit:"Rafi Arafah Putra",creditUrl:"https://www.pexels.com/@rafi-arafah-putra-2047879",note:"There are mornings when a kali looks almost pastoral. That is a trick of early light and distance. I make the frame anyway. A habitat includes its calm days. The field notes exist so the calm is not mistaken for the whole."}),Z({pexelsId:37913419,id:"kali-03",frameNo:"11A",alt:"Representative work. River corridor flanked by industrial and apartment buildings.",orientation:"landscape",ground:"Concrete reach",film:"HP5 400",aperture:"f/11",credit:"Leila Chen",creditUrl:"https://www.pexels.com/@leila-chen-2157146213",note:"Normalization means a wall, a road, a promise that the river will stay in its lane. The print is mostly verticals. I wait for a small human figure so the concrete has a scale. Without the figure the wall looks like an idea."}),Z({pexelsId:4394652,id:"kali-04",frameNo:"15A",alt:"Representative work. Bridge over a dark river at night.",orientation:"landscape",ground:"Bridge, after rain",film:"HP5 400",aperture:"f/4",credit:"marco allasio",creditUrl:"https://www.pexels.com/@marco-allasio-2733664",note:"Manggarai after rain. The underpass holds a different weather from the street. I have stood here through three flood seasons. The water marks on the pillars are a calendar no office publishes."}),Z({pexelsId:38706314,id:"kali-05",frameNo:"18A",alt:"Representative work. Stilt house beside a canal.",orientation:"landscape",ground:"Stilt line",film:"HP5 400",aperture:"f/5.6",credit:"Valeria Drozdova",creditUrl:"https://www.pexels.com/@valeria-drozdova-2148646707",note:"A house on stilts is an argument with the wet season. I photograph the gap between floor and water. That gap is the whole story: how much room a family has left to negotiate with the river."}),Z({pexelsId:13517353,id:"kali-06",frameNo:"23A",alt:"Representative work. Fish seller beside a folding chair near water.",orientation:"landscape",ground:"Bank trade",film:"HP5 400",aperture:"f/4",credit:"The Humantra",creditUrl:"https://www.pexels.com/@thehumantra",note:"Trade happens on the bank because the bank is a road that does not ask for rent. A chair, a basin, a day's catch. I keep my distance. The river is already close enough."}),Z({pexelsId:37436617,id:"kali-07",frameNo:"27A",alt:"Representative work. Aerial view of a settlement along water.",orientation:"landscape",ground:"From a high walkway",film:"HP5 400",aperture:"f/8",credit:"Somogro Bangladesh",creditUrl:"https://www.pexels.com/@somogrobangladesh",note:"I dislike the aerial as a habit. It can turn a kampung into texture. Once in a while I climb a walkway to remember the shape of the water through the roofs. Then I go back down. The work is at eye level."}),Z({pexelsId:10880258,id:"kali-08",frameNo:"33A",alt:"Representative work. Wide river bending through a low city.",orientation:"landscape",ground:"Long bend",film:"HP5 400",aperture:"f/11",credit:"Pok Rie",creditUrl:"https://www.pexels.com/@pok-rie-33563",note:"Ciliwung has a memory longer than the city that claims it. From certain bridges the bend still looks like a river and not a drain. I make this frame in the dry season, when the water is low enough to show the city's waste as a shoreline."})]},{id:"kampung",rollNo:"R-0314",title:"Kampung",indonesian:"kampung",translation:"urban village",stock:"Ilford Delta 400",intro:"A kampung in Jakarta is not the opposite of the city. It is the city at a scale a hand can hold. Gang narrow enough that laundry becomes a roof. Doors that open onto other lives. Kota Tua keeps a public face for visitors. The work is usually one turning off the square, where the arcade becomes a corridor and the corridor becomes a kitchen.",sleeve:"Delta 400 for the midtones in deep shade. I walk without a list. If someone asks what I am doing I say I am learning the light in this gang. It is the only answer that has never felt like a lie.",frames:[Z({pexelsId:14352236,id:"kampung-01",frameNo:"03A",alt:"Representative work. Narrow alley with hanging laundry and two figures.",orientation:"portrait",ground:"Laundry gang",film:"Delta 400",aperture:"f/5.6",credit:"Kaan Keskin",creditUrl:"https://www.pexels.com/@depthofraw",note:"Laundry is a census. You can read a household from what hangs: school shirts, a sarong, a work uniform. I photograph the line, not the windows. Privacy is a door I do not open."}),Z({pexelsId:25712634,id:"kampung-02",frameNo:"08A",alt:"Representative work. Tight passage between weathered houses and plants.",orientation:"portrait",ground:"Planted passage",film:"Delta 400",aperture:"f/8",credit:"Theodore Nguyen",creditUrl:"https://www.pexels.com/@thejourneyofframes",note:"Pots in a gang are a kind of civic work. Someone waters them. Someone moves them when a motorbike needs the width. The plants make the walls less like walls. I expose for the leaves so the concrete falls back."}),Z({pexelsId:19320436,id:"kampung-03",frameNo:"12A",alt:"Representative work. Clotheslines spanning between upper floors.",orientation:"portrait",ground:"Upper lines",film:"Delta 400",aperture:"f/8",credit:"Turuncu Sakal",creditUrl:"https://www.pexels.com/@turuncu-sakal-523826045",note:"Look up. The kampung continues above the head. Lines cross from house to house because the air between them is shared. I tilt the camera and accept the converging walls. Geometry here is not a design choice."}),Z({pexelsId:10800837,id:"kampung-04",frameNo:"16A",alt:"Representative work. Low angle view of drying clothes between apartments.",orientation:"portrait",ground:"Looking up, late day",film:"Delta 400",aperture:"f/11",credit:"Eylül Kuşdili",creditUrl:"https://www.pexels.com/@eylulkusdili",note:"Late day turns the laundry into flags. I do not chase that metaphor in the notes. I only need the backlight to separate cloth from wall. A print should hold both the poverty of the gap and the care of the hanging."}),Z({pexelsId:38282549,id:"kampung-05",frameNo:"20A",alt:"Representative work. Aged buildings and hanging laundry in a narrow street.",orientation:"landscape",ground:"Shared street",film:"Delta 400",aperture:"f/5.6",credit:"Jerry Zhang",creditUrl:"https://www.pexels.com/@jerry-zhang-392997481",note:"Bukit Duri taught me that a street can be a living room. After the evictions, what remains is often a wall and a memory of width. I photograph the streets that still function as rooms. They will not all last."}),Z({pexelsId:22191893,id:"kampung-06",frameNo:"24A",alt:"Representative work. Dark narrow alley receding between walls.",orientation:"portrait",ground:"Deep gang",film:"Delta 400",aperture:"f/2.8",credit:"Ranjeet Chauhan",creditUrl:"https://www.pexels.com/@ranjeet-chauhan-485922",note:"Some gangs hold almost no light. I push the film a stop and accept the grain. Grain is honest about humidity and haste. A clean print from a place like this would be a kind of lie."}),Z({pexelsId:33953565,id:"kampung-07",frameNo:"27A",alt:"Representative work. A solitary figure walking away down an urban alley.",orientation:"portrait",ground:"Figure, receding",film:"Delta 400",aperture:"f/4",credit:"Amaury Michaux",creditUrl:"https://www.pexels.com/@amaurymic",note:"I prefer backs to faces in the kampung. A back is a person going home. A face in a narrow place can feel like a demand. The figure gives the walls a pulse and then leaves them to their work."}),Z({pexelsId:24596502,id:"kampung-08",frameNo:"30A",alt:"Representative work. People gathered before an old colonial arcade.",orientation:"landscape",ground:"Kota Tua arcade",film:"Delta 400",aperture:"f/8",credit:"Andhika Indra Pratama",creditUrl:"https://www.pexels.com/@andhikapratama",note:"The square is for visitors. The arcade is for waiting. I stand under it until the posed photographs finish and the ordinary standing begins. That is when Kota Tua returns to being a neighborhood with a heavy past."}),Z({pexelsId:24596471,id:"kampung-09",frameNo:"32A",alt:"Representative work. Historic museum facade and open square.",orientation:"landscape",ground:"Fatahillah light",film:"Delta 400",aperture:"f/11",credit:"Andhika Indra Pratama",creditUrl:"https://www.pexels.com/@andhikapratama",note:"Midday on the square is unkind. The stone reflects. Faces close. I make a frame of the building anyway, as a control: this is the official Jakarta, the one that photographs easily. The rest of the roll is the rebuttal."}),Z({pexelsId:7181493,id:"kampung-10",frameNo:"36A",alt:"Representative work. Dense rooftops of an urban settlement.",orientation:"landscape",ground:"Roof census",film:"Delta 400",aperture:"f/8",credit:"Tom Fisk",creditUrl:"https://www.pexels.com/@tomfisk",note:"Roofs are a map of improvisation. Zinc, tile, tarpaulin, a dish, a plant. I take this frame once a year from the same high point if I can still reach it. Change reads more clearly in roofs than in speeches."})]},{id:"jalan",rollNo:"R-0401",title:"Jalan",indonesian:"jalan",translation:"the walking hours",stock:"Kodak Double-X 5222",intro:"The work is the walk. Not the destination and not the decisive moment as it is usually sold. I leave before the heat thickens. I come back when the rain has rewritten the streets. Between those hours Jakarta prints itself: reflections, exhaust, a scooter cutting a puddle, a vendor who has been in the same patch of shade for a decade.",sleeve:"Double-X because it likes bad light. These frames are from the hours between bodies of work, when I am only walking and the camera is a way of staying awake. Printed here so the archive does not pretend the city is only pasar, kali, and kampung.",frames:[Z({pexelsId:11270694,id:"jalan-01",frameNo:"05A",alt:"Representative work. Motorcyclist in heavy rain on a night street.",orientation:"landscape",ground:"Rain, arterial",film:"Double-X",aperture:"f/2",credit:"Andre Mouton",creditUrl:"https://www.pexels.com/@andre-mouton",note:"Rain is a developer. It brings the street up from black. I do not protect the camera as carefully as I should. A little weather on the lens is closer to how the eyes work at that hour."}),Z({pexelsId:34787012,id:"jalan-02",frameNo:"09A",alt:"Representative work. Cyclist on a wet city street.",orientation:"landscape",ground:"After the first drop",film:"Double-X",aperture:"f/4",credit:"Ama Journey",creditUrl:"https://www.pexels.com/@ama-journey-2157145868",note:"The first rain is a different city from the long rain. People still try to keep their pace. I like that stubbornness. The bicycle is a good meter: if it is still out, the day has not given up."}),Z({pexelsId:16321793,id:"jalan-03",frameNo:"13A",alt:"Representative work. Market stalls under umbrellas on a storm-dark street.",orientation:"landscape",ground:"Stall line, storm",film:"Double-X",aperture:"f/4",credit:"Th2city Santana",creditUrl:"https://www.pexels.com/@th2city",note:"Umbrellas turn a street into a low hall. I stand under one and photograph out, so the rain is a curtain and not a subject. Vendors who stay open in weather are not being picturesque. They are keeping a day from being a loss."}),Z({pexelsId:33375063,id:"jalan-04",frameNo:"17A",alt:"Representative work. Crowded street filled with motorbikes and walkers.",orientation:"landscape",ground:"Junction",film:"Double-X",aperture:"f/5.6",credit:"daydream",creditUrl:"https://www.pexels.com/@daydream-753072845",note:"A Jakarta junction is an ecology. Motorbikes school like fish. I do not freeze them as a trick. I let a little motion stay. The print should feel like standing in it, not like having solved it."}),Z({pexelsId:20388924,id:"jalan-05",frameNo:"21A",alt:"Representative work. Scooter passing a man at a gate.",orientation:"landscape",ground:"Gate hour",film:"Double-X",aperture:"f/4",credit:"irwan zahuri",creditUrl:"https://www.pexels.com/@irwan-zahuri-259816440",note:"Two speeds in one frame: the scooter and the man who has decided not to hurry. I have made this picture in more than one neighborhood. It is less a location than a tempo the city keeps."}),Z({pexelsId:31593298,id:"jalan-06",frameNo:"24A",alt:"Representative work. Man on a scooter carrying a basket through a market street.",orientation:"landscape",ground:"Loaded scooter",film:"Double-X",aperture:"f/5.6",credit:"Alfred Rosales",creditUrl:"https://www.pexels.com/@alfred-rosales-1725930672",note:"What a scooter can carry is a better portrait of the informal city than any skyline. Basket, stove, a child, a week's stock. I follow until the load reads clearly against the street."}),Z({pexelsId:17260113,id:"jalan-07",frameNo:"28A",alt:"Representative work. Woman pushing a bicycle through a crowded market street.",orientation:"landscape",ground:"On foot, with goods",film:"Double-X",aperture:"f/4",credit:"Tony Wu",creditUrl:"https://www.pexels.com/@tonywuphotography",note:"Not everyone has a motor. The bicycle through a crowd is a kind of courtesy and a kind of labor. I keep the camera low so the bags have the dignity of being the point."}),Z({pexelsId:12644636,id:"jalan-08",frameNo:"30A",alt:"Representative work. Long exposure of street movement and figures.",orientation:"landscape",ground:"Shutter dragged",film:"Double-X",aperture:"f/11",credit:"Muhammet Girgin",creditUrl:"https://www.pexels.com/@muhammet-girgin-193600550",note:"Once in a roll I drag the shutter. Not for style. To remember that the walk is duration. The still figures are the ones who live here. The blur is everyone else, including me."}),Z({pexelsId:29801145,id:"jalan-09",frameNo:"33A",alt:"Representative work. Rain-soaked food stall lit at night.",orientation:"landscape",ground:"Stall light, wet",film:"Double-X",aperture:"f/2",credit:"Oktay Köseoğlu",creditUrl:"https://www.pexels.com/@oktay-koseoglu-42034955",note:"A stall at night in rain is a small indoor. The light is ugly and perfect. I expose for the coals or the lamp and let the street fall away. Someone is always still selling. That fact is the city."}),Z({pexelsId:34787017,id:"jalan-10",frameNo:"36A",alt:"Representative work. Street vendor selling fruit from a bicycle.",orientation:"landscape",ground:"Last frame, fruit cart",film:"Double-X",aperture:"f/5.6",credit:"Ama Journey",creditUrl:"https://www.pexels.com/@ama-journey-2157145868",note:"I often end a walk on a fruit cart. It is a way of leaving the day without a climax. The last frame on a roll should not be a conclusion. It should be something I could photograph again tomorrow."})]}],fy=[fe[0].frames[0],fe[1].frames[0],fe[2].frames[0],fe[3].frames[0],fe[0].frames[6],fe[2].frames[7],fe[1].frames[3],fe[3].frames[3]],sy=[{src:"images/loupe-sheet.jpg",alt:"A loupe held over a wet contact sheet of street frames.",caption:"Loupe on the wet sheet. The select is made here, not in the street.",wide:!1},{src:"images/field-notes.jpg",alt:"Open field notebook beside a strip of film negatives.",caption:"Notes the same evening. Memory is a poor archivist in this humidity.",wide:!1},{src:"images/darkroom-tray.jpg",alt:"A silver gelatin print appearing in a developing tray.",caption:"The tray is the last edit. What does not hold in the chemical does not hold.",wide:!0},{src:df(8113890),alt:"Hands examining film negatives with a magnifier.",caption:"Representative work. Negatives on the table before any print is made.",wide:!1,credit:"Annushka Ahuja"},{src:df(10276247),alt:"Film negatives arranged on a light table.",caption:"Representative work. A roll is a sentence. A single frame is only a word.",wide:!1,credit:"Ron Lach"}],oy=[{rollNo:"R-0044",body:"Pasar",ground:"Senen, predawn kue",stock:"HP5",frames:"36",status:"sleeved"},{rollN
