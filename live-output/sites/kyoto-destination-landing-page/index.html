Name:"mx-auto max-w-[1440px] px-5 py-20 md:px-8 md:py-28",children:[c.jsxs("div",{className:"grid gap-12 md:grid-cols-12",children:[c.jsxs(Q,{className:"md:col-span-5",children:[c.jsx(Dt,{jp:"千年の都",en:"Sennen no miyako · the thousand-year capital"}),c.jsx("h2",{className:"display mt-5 text-5xl italic md:text-7xl",children:"A court that outlasted its own government"}),c.jsxs("div",{className:"measure mt-8 space-y-5 text-[1.02rem] font-light leading-8",children:[c.jsx("p",{children:"Kyoto is not old in the sense of untouched. It is old in the sense of repeatedly repaired. The Heian grid, the Muromachi ashes, the Tokugawa peace, the Meiji canal, the decision of American planners to spare the city in 1945: each layer is visible if you stop treating the wooden façade as original skin."}),c.jsx("p",{children:"The Imperial Palace still occupies the north-center of the old plan, though the present buildings are later reconstructions inside the Kyoto Gyoen. North remains ceremonial. East gathers temples against Higashiyama. West opens to water and bamboo hills. South, Fushimi, keeps the wells and the Inari mountain."})]})]}),c.jsx(Q,{delay:100,className:"md:col-span-7",children:c.jsxs("div",{className:"img-frame relative aspect-[16/10] border border-line",children:[c.jsx("video",{className:"h-full w-full object-cover",autoPlay:!0,muted:!0,loop:!0,playsInline:!0,preload:"metadata",poster:de.autumnTemple,"aria-label":"Temple roofs among forested hills",children:c.jsx("source",{src:za.autumnTemple,type:"video/mp4"})}),c.jsx("p",{className:"caption absolute bottom-0 left-0 bg-page/75 px-4 py-2",children:"Temple roofs in a forested hill. Seasonal film, unnamed precinct."})]})})]}),c.jsx("ol",{className:"mt-20 grid gap-0 border-t border-line md:grid-cols-2",children:xy.map((v,C)=>c.jsx(Q,{delay:C*40,children:c.jsxs("li",{className:"grid gap-4 border-b border-line py-8 md:grid-cols-[7rem_1fr] md:gap-8 md:px-4",children:[c.jsx("p",{className:"font-display text-3xl italic text-tea",c  still inside that plan, even where the avenue itself has vanished."},{id:2,group:"A",x:148,y:118,w:40,h:28,rot:12,path:"M6 16C8 6 20 3 30 8C38 12 40 20 34 26C26 32 12 30 8 24C4 20 4 18 6 16Z",jp:"応仁",romaji:"Ōnin",en:"The war that burned the grid",kicker:"1467 to 1477",body:"The Ōnin War began as a succession quarrel inside the Muromachi shogunate and ate the capital street by street. Palaces, workshops, and temple halls went to ash. Weavers fled. When they returned they gathered near the old western encampment, and that quarter kept the name Nishijin (西陣, western camp). Much of what visitors now call traditional Kyoto is a reconstruction built after this decade of fire, not a continuous Heian surface."},{id:3,group:"A",x:118,y:228,w:46,h:30,rot:8,path:"M7 18C9 7 22 4 34 8C44 12 48 20 42 27C34 34 16 34 10 28C5 23 5 21 7 18Z",jp:"西陣織",romaji:"Nishijin-ori",en:"Yarn-dyed silk of the west camp",kicker:"Thread before pattern",body:"Nishijin weaving dyes the thread first, then builds the picture in the loom. The Hata clan brought sericulture to this basin in the fifth and sixth centuries. Court demand after 794 made the craft official. After Ōnin the weavers' return defined the district that still stands north of the palace. A single ceremonial obi can occupy a workshop for weeks. Houses such as Hosoo, working since 1688, now send the same figured silks to fashion ateliers without abandoning the Jacquard and hand techniques that keep the cloth heavy, cool, and exact."},{id:4,group:"A",x:196,y:196,w:36,h:24,rot:-8,path:"M5 13C7 5 16 3 25 6C32 9 34 16 28 21C21 26 10 24 6 19C3 16 3 15 5 13Z",jp:"京友禅",romaji:"Kyō-yūzen",en:"Resist-dyed pictorial cloth",kicker:"From a fan painter's hand",body:"Miyazaki Yūzensai, a fan painter working in the Genroku years of the Edo period, gave his name to a method of drawing rice-paste resist so that color could be painted onto silk without bleeding. Later, Hirose Jisuke's Meiji stencils made the language faster without emptying it. Kyō-yūzen is a division of labor: sketcher, paster, colorist, steamer, washer. The finished kimono is a city of specialists, not a solitary signature."},{id:5,group:"A",x:64,y:102,w:32,h:22,rot:22,path:"M4 12C6 4 14 3 22 6C28 9 30 15 25 19C18 24 8 22 5 17C3 14 3 14 4 12Z",jp:"清水焼",romaji:"Kiyomizu-yaki",en:"Kyoto ware from borrowed clay",kicker:"Kiln ash, not local earth",body:"Kyō-yaki and Kiyomizu-yaki grew along the slope to Kiyomizu-dera, especially around Gojōzaka. The basin is poor in distinguished clay, so potters imported bodies and spent their ambition on glaze, painting, and form. Nonomura Ninsei, in the mid-seventeenth century, set a courtly polychrome standard for tea utensils. The ware is not a single look. It is a permission to be various, which is why a Kyoto table can hold iron-dark raku beside a bowl the color of wood ash."},{id:6,group:"B",x:318,y:150,w:50,h:32,rot:-6,path:"M8 18C10 7 24 4 38 8C48 12 52 21 46 28C38 36 18 36 10 29C5 24 6 22 8 18Z",jp:"懐石",romaji:"Kaiseki",en:"The meal before thick tea",kicker:"Sequence as hospitality",body:"Cha-kaiseki began as the small meal that keeps a guest from drinking koicha (濃茶, thick tea) on an empty stomach. In Kyoto it grew into Kyō-kaiseki, a seasonal sequence in which the plate is a calendar. Houses such as Kikunoi and Hyōtei still treat the year as the true menu. Do not confuse it with a tasting menu assembled for spectacle. The point is the temperature of a soup, the cut of a mountain vegetable, and the moment the lid is lifted."},{id:7,group:"B",x:372,y:214,w:38,h:26,rot:14,path:"M6 14C8 5 18 3 28 7C35 10 38 17 32 22C24 28 12 26 7 21C4 17 4 16 6 14Z",jp:"湯豆腐",romaji:"Yudōfu",en:"Tofu in kelp broth",kicker:"Soft water, soft curd",body:"Kyoto's water is soft, running off cedar slopes into the Kamo and the underground veins of Fushimi. That water makes a finer tofu. Yudōfu is the honest form: silken blocks warmed in kombu broth and dipped in ponzu or a light soy. Around Nanzen-ji the dish is still eaten as temple food that wandered into restaurants. Yuba, the skin lifted from heated soymilk, is the same water and bean, only thinner."},{id:8,group:"C",x:508,y:128,w:44,h:30,rot:-14,path:"M7 17C9 6 21 4 33 8C42 12 46 20 40 26C32 33 16 33 10 27C5 22 5 20 7 17Z",jp:"伏見酒",romaji:"Fushimi-zake",en:"Sake of the southern wells",kicker:"Gekkeikan since 1637",body:"Fushimi sits on a fan of subterranean water so valued that brewers still speak of wells the way gardeners speak of stones. The quarter became one of Japan's great sake districts in the Edo period. Gekkeikan began here in 1637. Cedar kura, canal water, and the smell of steamed rice still mark the streets south of the Inari mountain. Taste the difference between a ceremonial cup at a shrine and a brewery's unpasteurized nama drawn cold from the tank."},{id:9,group:"C",x:558,y:198,w:36,h:24,rot:10,path:"M5 13C7 5 16 3 25 7C31 10 34 16 28 20C21 25 10 23 6 18C3 15 3 15 5 13Z",jp:"五花街",romaji:"Gokagai",en:"Five flower districts",kicker:"Geiko and maiko at work",body:"Kyoto keeps five active kagai, locally preferred over the word hanamachi: Gion Kōbu, Gion Higashi, Ponto-chō, Miyagawa-chō, and Kamishichiken. A geiko (芸妓) is a fully fledged performing artist. A maiko (舞妓) is her apprentice. They are not costume staff. Public dances such as Miyako Odori in April remain the proper way to see the art. Private alleys off Hanamikoji have been closed to tourist traffic, with fines. Do not follow, block, or photograph a performer without clear permission."},{id:10,group:"C",x:498,y:250,w:42,h:26,rot:4,path:"M6 15C8 6 20 3 31 7C39 11 42 18 36 23C28 29 14 28 8 22C4 18 4 17 6 15Z",jp:"祇園祭",romaji:"Gion Matsuri",en:"Yasaka's month of floats",kicker:"July, twice processed",body:"Gion Matsuri belongs to Yasaka Shrine and occupies most of July. Its great wooden yamaboko floats, some hung with medieval tapestries, roll on the 17th and again on the 24th. The procession is a UNESCO-listed practice, but the month is larger than the parade: screen displays, neighborhood watches, and the slow assembly of timbers without nails. It is a civic machine older than the modern ward map."},{id:11,group:"D",x:688,y:156,w:48,h:30,rot:-10,path:"M7 17C10 6 24 4 36 8C46 12 50 20 44 27C36 34 18 34 10 28C5 23 5 21 7 17Z",jp:"東山",romaji:"Higashiyama",en:"The eastern slope",kicker:"Stage, lanes, and silver",body:"Southern Higashiyama holds Kiyomizu-dera's wooden stage, the Sannen-zaka and Ninen-zaka lanes, Kōdai-ji, and the approach to Yasaka. Northern Higashiyama is quieter: Ginkaku-ji (Jishō-ji, the Silver Pavilion), the canal path called Tetsugaku no Michi (哲学の道, Philosopher's Path), Nanzen-ji's brick aqueduct, and Eikan-dō. The philosopher Nishida Kitarō walked the canal on his way to lecture. The path is not a slogan. It is a commuting route that became a season clock for maples and camellia."},{id:12,group:"D",x:742,y:224,w:36,h:24,rot:16,path:"M5 13C7 5 16 3 25 6C32 9 34 16 28 20C20 25 10 23 6 18C3 15 3 15 5 13Z",jp:"嵐山",romaji:"Arashiyama",en:"Storm mountain, west water",kicker:"Tenryū-ji and the river",body:"Arashiyama is the western hinge of the basin, where the Ōi River is crossed by Togetsukyō and the Zen temple Tenryū-ji keeps a garden attributed to Musō Soseki. The much photographed grove is only a corridor. Give the hours to Ōkōchi Sansō, to the boat from Kameyama, or to the Randen tram that still threads residential west Kyoto. In summer the river restaurants build platforms over the current. In winter the same water goes iron-colored and almost empty."},{id:13,group:"E",x:868,y:132,w:46,h:30,rot:8,path:"M7 17C9 6 22 4 34 8C44 12 48 20 42 27C34 34 16 33 10 27C5 22 5 20 7 17Z",jp:"宇治茶",romaji:"Uji-cha",en:"Shaded tea of the south",kicker:"Byōdō-in in the same town",body:"Uji, just south of the city, has grown tea since the Kamakura period and still sets the standard for shaded leaf: gyokuro and the tencha that is stone-milled into matcha. The same town holds Byōdō-in's Phoenix Hall, a Heian vision of the Western Paradise that later found its way onto the ten-yen coin. Drink thick tea here after walking the river. The leaf and the hall explain each other: both are court culture that took root in a suburb and never left."},{id:14,group:"E",x:910,y:208,w:38,h:26,rot:-12,path:"M6 14C8 5 18 3 28 7C35 10 38 17 32 22C24 28 12 26 7 20C4 17 4 16 6 14Z",jp:"西芳寺",romaji:"Saihō-ji",en:"The moss temple",kicker:"Write first, then enter",body:"Saihō-ji, called Kokedera, is a Rinzai temple in the west whose ground became a moss garden of more than a hundred species after the pond garden of Musō Soseki was left to humidity and shade. Entry is by application, not by ticket queue. You copy a sutra before walking. That delay is the architecture. The moss is not decoration. It is what happens when a pond garden is allowed to become a climate."},{id:15,group:"E",x:848,y:258,w:34,h:22,rot:20,path:"M5 12C7 4 15 3 23 6C29 9 31 15 26 19C19 23 9 22 6 17C3 14 3 14 5 12Z",jp:"見隠",romaji:"Miegakure",en:"The withheld stone",kicker:"Fifteen is completeness you cannot hold",body:"From any seat on the hōjō veranda at Ryōan-ji, at least one of the fifteen stones stays hidden. Fifteen, in the older East Asian count, is a full moon, a finished set. The garden refuses the set. Garden historian Gunter Nitschke argued that the composition does not symbolize islands or tigers so much as it incites looking. Kyoto works by the same rule. The lane you did not enter, the meal you did not book, the stone behind the stone: that remainder is not a failure of the visit. It is the visit."}],Od=90,jy=910;function Ny(v){const C={x:v,y:392},D=En.map(w=>{const U=w.x+w.w/2,R=w.y+w.h/2,ae=U-C.x,z=R-C.y,N=Math.hypot(ae,z),I=Math.atan2(ae,-z),k=Math.atan(w.w*.62/Math.max(N,1));return{id:w.id,angle:I,dist:N,half:k}}),h=[.85,1.1,1.45,1.9,2.6,3.6,5];for(const w of h){const U=[];for(const R of D){let ae=0;for(const z of D){if(R.id===z.id||R.dist<=z.dist)continue;const N=Math.abs(R.angle-z.angle);N<z.half*w&&(ae+=(z.half*w-N)/(z.half
