ng princess Hang Li Po arriving with a retinue as a gift to the sultan is almost certainly legend, and worth knowing anyway, because the town has always preferred a good story. The tomb hill is not legend: Bukit Cina has held the town's Chinese dead since the fifteenth century."],quote:{text:"Takkan Melayu hilang di dunia.",attr:"The oath of Hang Tuah, the sultanate's admiral: never shall the Malays vanish from the world."},terms:[{t:"pelanduk",d:"the mouse deer"},{t:"laksamana",d:"the admiral"},{t:"bukit cina",d:"the hill of the dead"}],figure:Ce.reflection},{overline:"1511 to 1641 · the first clasp",title:"A Famosa",local:"the Portuguese layer",stone:"var(--rose)",paras:["In 1511 Afonso de Albuquerque took the town after two assaults, and built his fortress out of the sultan's mosque and the graves of the sultan's house. He was right about the location: the gate that remains, Porta de Santiago, is the most fought over doorway in the country. When the British finally pulled the fortress down in 1807, Raffles, passing through on sick leave, begged for the gate to be spared. Empires here leave a door.","The Portuguese kept the port for one hundred and thirty years, long enough for a new people to be born on it: the Kristang, children of Portuguese men and Malay, Indian and Kristang wives, whose creole is still spoken at the Settlement. In June, for the Feast of San Pedro, the boats are blessed with flags and incense and the sea is thanked in a language with no grammar book. At Christmas there is kari debal, the devil's curry, so named because the leftover meats and vinegar outlive the party."],quote:{text:"The gate you photograph is the whole fortress, and that is the whole lesson.",attr:"Street wisdom, the gate of A Famosa."},terms:[{t:"bondia",d:"good day, in Kristang"},{t:"mutu grandi",d:"thank you, in Kristang"},{t:"kari debal",d:"the devil's curry"}],figure:Ce.fountain},{overline:"1641 to 1824 · the second clasp",title:"Stadthuys",local:"the Dutch layer",stone:"var(--jade)",paras:["In 1641 the Dutch East India Company took the town with Johor's fleet, and it was the town's misfortune to be administered by an account book. The Stadthuys went up around 1650, the oldest Dutch civic building in the East, and Christ Church followed in 1753 with bricks said to have crossed as ballast in the holds of merchantmen. The salmon red that every poster knows was a British era repaint, around 1911. The Dutch never saw their town in red.","They governed through kapitans, community captains who kept order and collected taxes, and they left behind a small, tidy graveyard on St Paul's Hill where the tombstones face the strait, because even the dead of the VOC could not stop watching the water. When Napoleon's wars reached Asia, the company simply ran out of world."],quote:{text:"The Dutch never saw their town in salmon.",attr:"On the red of Dutch Square."},terms:[{t:"VOC",d:"the East India Company"},{t:"kapitan",d:"community captain"},{t:"Zeeland",d:"the bricks' old country"}],figure:Ce.christChurch},{overline:"1824 to 1957 · the third clasp",title:"Heeren Street",local:"the British layer",stone:"var(--chilli)",paras:["In 1824 the Anglo-Dutch Treaty traded Malacca for Bencoolen the way children trade cards, and the town dozed in the shadow of Singapore. It bit back once. In 1831, in the Naning War, a village chief named Dol Said handed the East India Company its first defeat on the peninsula; the British needed a second campaign and a bigger army to close the file. Then came the quiet century: rubber, tin, and the great Straits Chinese houses along Heeren Street, fortunes made in the light of gas lamps.","On 20 February 1956, after the talks in London, the declaration of independence was read here at the Padang Pahlawan, in the heat of a February afternoon. The town's long occupation ended where it had begun: outdoors, in Malay, beside the water."],quote:{text:"A village chief named Dol Said handed the East India Company its first defeat on
