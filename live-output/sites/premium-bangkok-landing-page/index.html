it=crop&h=630&w=1200"},il=[{id:"name-one",num:"๑",index:1,thai:"กรุงเทพมหานคร",roman:"Krung Thep Maha Nakhon",gloss:"City of angels · the great city",title:"Ten million angels, all of them late",keyword:{thai:"สนุก",roman:"sanuk",en:"fun: a civic duty, not a leisure activity"},lead:"The name begins with heaven and continues with traffic.",body:["Krung Thep is what Bangkok calls itself: the City of Angels, the Great City. Ten million people share the name, and the sidewalks, and the same fourteen lanes of afternoon. Golden chedis interrupt glass towers mid-sentence. The Skytrain arcs over canals a king once paddled. A monk scrolls through his phone beside a spirit house; a food cart glows like a shrine and the crowd around it prays in the only language that matters: the sound of a wok on fire.","Here hurry is a civic religion, reo reo, quickly quickly, and yet nobody is ever truly late, because the great city itself never arrives. It only becomes."],note:"In 2022, the cabinet made the long name official in government documents. The city shrugged, politely.",variant:"fullbleed",media:[{kind:"video",src:"https://videos.pexels.com/video-files/29553755/12721321_3840_2160_50fps.mp4",poster:"https://images.pexels.com/videos/29553755/aerial-photograph-aerial-view-asia-asian-food-29553755.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"The great city, seen from above at dusk",credit:"LayG Traveller"}]},{id:"name-two",num:"๒",index:2,thai:"อมรรัตนโกสินทร์",roman:"Amon Rattanakosin",gloss:"The undying jewel city",title:"Gold leaf, applied by hand",keyword:{thai:"ทอง",roman:"thong",en:"gold: also anything precious enough to keep"},lead:"The second name is a jewel that refuses to die.",body:["Rattanakosin, the gem of Indra, is the island at the city's heart where King Rama I raised his palace in 1782. Its halls are crusted in gold leaf hammered thinner than a thought; every morning restorers climb the scaffolding and add another millionth of a millimetre to forever. Inside the chapel sits the Emerald Buddha, carved, the story goes, from a single block of jade, dressed in new seasonal robes by the king's own hand.","Amon: undying. The city has burned, flooded, been sacked and rebuilt, and the gold simply grows back. Immortality, here, is a maintenance schedule."],note:"The Grand Palace was completed in 1785. It has never stopped being completed.",variant:"splitL",media:[{kind:"img",src:"https://images.pexels.com/photos/11104933/pexels-photo-11104933.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"Golden spires of the royal palace quarter",credit:"Maksim Romashkin"},{kind:"img",src:"https://images.pexels.com/photos/30322239/pexels-photo-30322239.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"The palace compound under a flat blue sky",credit:"phutanet boonsuwan"}]},{id:"name-three",num:"๓",index:3,thai:"มหินทรายุธยา",roman:"Mahinthara Ayuthaya",gloss:"The unconquerable city of Indra",title:"A city that refuses to drown",keyword:{thai:"น้ำ",roman:"nam",en:"water: the original pavement"},lead:"Ayutthaya, the old capital, fell in 1767. Its name, and its genius, survived.",body:["Bangkok is Ayutthaya's second act. The old capital was built on water, and so was the new one: the Chao Phraya and its khlongs were the first streets, and the boatmen are still the oldest guild in town. Long-tails thread the canals past stilt houses, temples and mango trees; schoolchildren commute by river; a floating market is only a shop that learned to follow its customers.","In Thai, khlong means canal, but the word carries the whole memory of a city once called the Venice of the East, and still wakes up on water every morning."],note:"Bangkok's first roads were dug, not paved; more than a thousand khlongs once crossed the city.",variant:"splitR",media:[{kind:"video",src:"https://videos.pexels.com/video-files/28941712/12524291_3840_2160_30fps.mp4",poster:"https://images.pexels.com/videos/28941712/bangkok-boat-boats-in-canal-canal-28941712.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"A long-tail boat threads a canal at dusk",credit:"Jayanth Muppaneni"},{kind:"img",src:"https://images.pexels.com/photos/37848280/pexels-photo-37848280.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"Colourful long-tails at rest in a khlong",credit:"Gibson Chan"}]},{id:"name-four",num:"๔",index:4,thai:"มหาดิลกภพนพรัตนราชธานีบูรีรมย์",roman:"Mahadilok Phop Noppharat Ratchathani Burirom",gloss:"Magnificent city of the nine gems · seat of the king",title:"A temple made of broken bowls",keyword:{thai:"ศรัทธา",roman:"sattha",en:"faith: the mortar that holds the shards"},lead:"The longest name in the longest name: nine gems, a king's seat, a delightful city.",body:["On the west bank stands Wat Arun, the Temple of Dawn, whose prang, a Khmer-style tower of 70 metres, wears one of the most famous materials in architecture: other people's rubbish. Chinese porcelain, carried as ballast on the trading ships, was broken on purpose and pressed into wet plaster, shard by shard, by hands that turned a dump into a sunrise.","The craft is called krachang. It is patient, unglamorous and divine. Millions of shards, no rush, no deadline. The temple is still being finished. That is the point."],note:"The prang is said to carry over a hundred thousand porcelain pieces. You may add a few.",variant:"mosaic",media:[{kind:"img",src:"https://images.pexels.com/photos/32024479/pexels-photo-32024479.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"Porcelain mosaic detail, Temple of Dawn",credit:"Tom Lorber"},{kind:"img",src:"https://images.pexels.com/photos/28905006/pexels-photo-28905006.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"The prang against a charged sky",credit:"Sophie Roome"}]},{id:"name-five",num:"๕",index:5,thai:"อุดมราชนิเวศน์มหาสถาน",roman:"Udom Ratchaniwet Maha Sathan",gloss:"The grand royal residence",title:"The river is the real palace",keyword:{thai:"แม่น้ำ",roman:"mae nam",en:"mother water: the Chao Phraya, politely"},lead:"The fifth name is a residence. The residence is a river.",body:["The Chao Phraya (Mae Nam, Mother of Waters) is the city's spine. Royal barges row in slow procession; commuter ferries pack at 8 a.m.; rice boats older than the kingdom still tie up at dusk. Palaces and shophouses share the bank, and the skyline leans over the water to admire itself. At golden hour the river performs the oldest show in Bangkok, and every hotel on the bank claims a front-row seat.","Udom Ratchaniwet: the home of royal dwellings. But the true royal residence of Bangkok has no walls, only a current."],note:"The Chao Phraya runs 372 kilometres; Bangkok was built on its last, patient bend.",variant:"fullbleed",media:[{kind:"video",src:"https://videos.pexels.com/video-files/20516176/20516176-uhd_3840_2160_60fps.mp4",poster:"https://images.pexels.com/videos/20516176/bangkok-boat-boat-ferry-drone-shot-20516176.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"Riding the river ferry, low over the water",credit:"Traveling on the Go"},{kind:"img",src:"https://images.pexels.com/photos/38409243/pexels-photo-38409243.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"A boat crosses the river at dusk, skyline behind",credit:"Dale Mohagan"}]},{id:"name-six",num:"๖",index:6,thai:"อมรพิมานอวตารสถิต",roman:"Amon Phiman Awatan Sathit",gloss:"The home of gods incarnate",title:"Gods on the morning commute",keyword:{thai:"บุญ",roman:"bun",en:"merit: goodness you give away and keep at once"},lead:"The sixth name says the gods live here. Look closer: they do.",body:["Bangkok is the most devout city that never stops for prayer. Monks walk the dawn alms round barefoot on wet asphalt; office workers offer jasmine garlands at spirit houses tucked into parking garages; taxi dashboards are shrines; the tattooist's needle and the monk's chant share the same neighbourhood. The divine is not quarantined in temples here; it rides the bus.","Amata: immortal. Awatan: incarnation. The city believes the gods incarnate daily: in saffron robes, in offerings of marigold, in a stranger's small, unasked kindness."],note:"Spirit houses outnumber mailboxes; the city is estimated to hold more than a million.",variant:"gallery",media:[{kind:"img",src:"https://images.pexels.com/photos/17960445/pexels-photo-17960445.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800",caption:"A senior monk before the evening chant",credit:"Namfon Sasimaporn",tall:!0},{kind:"img",src:"https://images.pexels.com/photos/30043805/pexels-photo-30043805.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800",caption:"Alms offered at dawn",credit:"Namfon Sasimaporn",tall:!0},{kind:"img",src:"https://images.pexels.com/photos/34096454/pexels-photo-34096454.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=800",caption:"Hands threading flower garlands at a street market",credit:"Tahamie Farooqui",tall:!0}]},{id:"name-seven",num:"๗",index:7,thai:"สักกทัตติยวิษณุกรรมประสิทธิ์",roman:"Sakkathattiya Witsanukam Prasit",gloss:"Built by Visvakarman at Indra's command",title:"The gods' architect works the wok",keyword:{thai:"อร่อย",roman:"aroi",en:"delicious: the highest compliment in the language"},lead:"The final name credits the builder: Visvakarman, architect of the gods. In Bangkok, his workshop is the street.",body:["Every soi is a construction site of flavour. The wok's blue flame is the city's sacred fire; the pestle of the som tam stall keeps time like a temple drum. Boat noodles, pad thai folded in a minute flat, satay smoke rising into neon: this is the divine craftsmanship the old name promised, edible, and open past midnight.","Sakkathattiya: by Indra's behest. Witsanukam: the architect of heaven. The name insists the city was built by the finest hands in the cosmos. The name is right. It is only that, these days, those hands hold a spatula."],note:"Bangkok has defended its street-food crown nightly for decades, and means to keep it.",variant:"splitL",media:[{kind:"video",src:"https://videos.pexels.com/video-files/29783836/12798292_3840_2160_25fps.mp4",poster:"https://images.pexels.com/videos/29783836/4k-drone-video-asia-asian-city-asian-food-29783836.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"Skewers over coals at a night market",credit:"LayG Traveller"},{kind:"img",src:"https://images.pexels.com/photos/18911914/pexels-photo-18911914.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1400",caption:"The late shift: vendors and steam",credit:"Tony Wu"}]}],pg=["LayG Traveller","Jayanth Muppaneni","Traveling on the Go","Pete Miller Portraits","Maksim Romashkin","Sophie Roome","Tom Lorber","phutanet boonsuwan","Onur Kaya","Rainier Narboneta","Tony Wu","min Thway","Gibson Chan","Valeria Drozdova","Ali Kazal","Musaddek Sayek","Namfon Sasimaporn","Tahamie Farooqui","Peggy Anke","Dale Mohagan","Gizem Çelebi","Optical Chemist","Trent Kloter","Dean Alexandrou"];function bg(s){const[y,m]=te.useState(-1);return te.useEffect(()=>{let f=0;const E=()=>{const _=window.innerHeight*.42;let H=-1,M=1/0;s.forEach((x,L)=>{const C=document.getElementById(x);if(!C)return;const P=Math.abs(C.getBoundingClientRect().top-_);P<M&&(M=P,H=L)}),m(x=>x===H?x:H)},O=()=>{cancelAnimationFrame(f),f=requestAnimationFrame(E)};return E(),window.addEventListener("scroll",O,{passive:!0}),window.addEventListener("resize",O),()=>{window.removeEventListener("scroll",O),window.removeEventListener("resize",O),cancelAnimationFrame(f)}},[s]),y}function Ls(){const[s,y]=te.useState(!1);return te.useEffect(()=>{const m=window.matchMedia("(prefers-reduced-motion: reduce)"),f=()=>y(m.matches);return f(),m.addEventListener("change",f),()=>m.removeEventListener("change",f)},[]),s}function xm(s){var y,m,f="";if(typeof s=="string"||typeof s=="number")f+=s;else if(typeof s=="object")if(Array.isArray(s)){var E=s.length;for(y=0;y<E;y++)s[y]&&(m=xm(s[y]))&&(f&&(f+=" "),f+=m)}else for(m in s)s[m]&&(f&&(f+=" "),f+=m);return f}fu
