6/pexels-photo-28902196.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Garden path leading up to Wat Phra That Doi Suthep in morning light"},{hour:7,time:"07:00",thai:"๐๗:๐๐",label:"Warorot wakes",text:"Flowers at Ton Lam Yai, gold shops rolling up shutters, rice porridge steaming at the curb.",image:"https://images.pexels.com/photos/37665429/pexels-photo-37665429.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Roses and cut flowers displayed at a market stall"},{hour:9,time:"09:00",thai:"๐๙:๐๐",label:"Coffee o'clock",text:"The hills grow arabica; every soi has a roastery, and most have a queue.",image:"https://images.pexels.com/photos/7658133/pexels-photo-7658133.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Iced coffee being poured into glasses"},{hour:11,time:"11:00",thai:"๑๑:๐๐",label:"Khao soi steam",text:"Crisp noodles, coconut curry, pickled mustard greens, lime. Steam rises over the lanes.",image:"https://images.pexels.com/photos/28543545/pexels-photo-28543545.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Bowl of curry noodle soup with a nest of crispy noodles"},{hour:13,time:"13:00",thai:"๑๓:๐๐",label:"The hottest hour",text:"Shutters down, dogs on temple steps, the city dozes till three.",image:"https://images.pexels.com/photos/16986825/pexels-photo-16986825.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"A Lanna temple with tiered roofs against a bright blue sky"},{hour:15,time:"15:00",thai:"๑๕:๐๐",label:"Workshop time",text:"Hammers on silver in Wua Lai, shavings in Baan Tawai, paint on umbrellas in Bo Sang.",image:"https://images.pexels.com/photos/32388091/pexels-photo-32388091.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"An artisan painting a traditional umbrella in a workshop"},{hour:17,time:"17:00",thai:"๑๗:๐๐",label:"Golden hour on the moat",text:"The light goes amber over the square; monks begin the evening chant.",image:"https://images.pexels.com/photos/36020575/pexels-photo-36020575.png?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"The great brick chedi of Wat Chedi Luang in Chiang Mai"},{hour:19,time:"19:00",thai:"๑๙:๐๐",label:"The night bazaar",text:"Silk, smoke, skewers; the walking streets open their stalls until ten.",image:"https://images.pexels.com/photos/31886133/pexels-photo-31886133.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Grilled skewers at a night market stall"},{hour:21,time:"21:00",thai:"๒๑:๐๐",label:"November: the sky lets go",text:"Khom loi rise by the thousand on the full moon of the twelfth lunar month.",image:"https://images.pexels.com/photos/10034809/pexels-photo-10034809.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"A crowd under a sky filled with glowing lanterns"},{hour:23,time:"23:00",thai:"๒๓:๐๐",label:"Last call",text:"By midnight the lanes are quiet. The city sleeps early on purpose.",image:"https://images.pexels.com/photos/415693/pexels-photo-415693.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600",alt:"Three sky lanterns ascending into the night"}];function m0(S){let j=rf[0],M=1/0;for(const m of rf){let D=Math.abs(m.hour-S);D>12&&(D=24-D),D<M&&(M=D,j=m)}return j}const Nr=["Founded in 1296 by King Mangrai, still called the new city","More than three hundred wats inside one square moat","The alms round starts before sunrise and ends by seven","Khao soi: crisp egg noodles, coconut curry, pickled mustard greens, lime","Yi Peng sets the sky loose on the full moon of the twelfth lunar month","Songkran in April turns the moat road into the north's biggest water fight","The red songthaew is the city bus; about thirty baht gets you across town","Smoke season, February to April: the hills haze, and the wise plan around it","The moat loop runs about six kilometers of flat, calm tarmac","A festival city that sleeps early: by eleven the walking streets fold up"],d0=[{id:"dawn",time:"05:00",thai:"บิณฑบาต",roman:"binthabat",title:"The streets belong to the monks",dek:"Chiang Mai's day does not begin with an alarm. It begins with giving.",body:["When the sky is still grey over the mountain, the wats open their gates and the lanes fill with saffron. Monks walk barefoot, bowls held at the waist, and householders kneel at the curb with sticky rice wrapped in banana leaf, or wait on the steps of Wat Chiang Man, the oldest temple in the city, founded the same year as Chiang Mai itself. Nobody hurries the round, and nobody extends it: by seven the streets belong to coffee.","Above the city, Wat Phra That Doi Suthep holds the mountain. The story goes that in 1383 a white elephant was sent out with a relic of the Buddha on its back; it climbed Doi Suthep, trumpeted three times, and lay down to die, so the temple was built where it stopped. The faithful still climb its 306 naga-guarded steps, and on clear evenings the gold chedi catches the last light over the plain."],media:[{type:"video",src:"https://videos.pexels.com/video-files/36026712/15277924_2560_1440_60fps.mp4",poster:"https://images.pexels.com/videos/36026712/pexels-photo-36026712.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"Mist over the mountain ridges north of the city",alt:"Aerial footage of misty mountain ridges at dawn",ratio:"aspect-[16/9]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/7695084/pexels-photo-7695084.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"The gilded chedi of Wat Phra That Doi Suthep under cloud",alt:"Golden pagoda of Wat Phra That Doi Suthep under cloudy skies",ratio:"aspect-[4/3]"},{type:"image",src:"https://images.pexels.com/photos/7453328/pexels-photo-7453328.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Monks on the morning alms round in a Thai city street",alt:"Monks in saffron robes receiving alms from locals on a street",ratio:"aspect-[4/3]",stock:!0}],quote:{text:"Monks do not ask. Givers give: rice, fruit, flowers, merit.",who:"The custom of the round"},margin:"Wat Chiang Man, 1296. Older than the street it stands on.",tone:"paper",layout:"right"},{id:"market",time:"07:00",thai:"กาดหลวง",roman:"kad luang",title:"Roses and market steam",dek:"Across the Ping, the old Chinese quarter is already loud.",body:["Kad Luang, the century-old Warorot Market, sells everything at once: dried shrimp by the kilo, curry pastes ground to order, wicker, gold. Next door, Ton Lam Yai is the flower market, and it is the reason for the old nickname. Kularb nuea, the Rose of the North: the name the city owes to Princess Dara Rasmi, who planted roses at her palace at the turn of the last century and started a fashion that never ended.","Every February the Flower Festival parades floats of blooms around the moat. By nine the market gives way to coffee. The hills around Chiang Mai grow some of Thailand's best arabica, and the old city has more roasters than wats have bells, or so the baristas say."],media:[{type:"image",src:"https://images.pexels.com/photos/37665429/pexels-photo-37665429.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Roses at a flower market: the nickname started with a princess's garden",alt:"Colorful display of roses and flowers at a market",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/16662041/pexels-photo-16662041.png?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"A florist's stall at market opening",alt:"Flowers in baskets and crates at a market stall",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/7658133/pexels-photo-7658133.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Iced coffee, the old city's morning fuel",alt:"Hand pouring coffee into glasses of iced milk",ratio:"aspect-[16/9]",stock:!0}],quote:{text:"Kularb nuea: the Rose of the North, named for a princess and her roses.",who:"The old nickname"},margin:"Ton Lam Yai: flowers by the river since the market age began.",tone:"parchment",layout:"left"},{id:"table",time:"11:00",thai:"ข้าวซอย",roman:"khao soi",title:"Steam over the lanes",dek:"Northern food is its own country, and its capital is this bowl.",body:["The signature is khao soi: egg noodles in coconut curry, crowned with a nest of crisp fried noodles, served with pickled mustard greens, shallots, and a wedge of lime. The story goes that it was born of the caravan routes that carried Muslim traders between Yunnan and Burma, which is why it tastes like nowhere else in Thailand.","Around it sits the rest of the Lanna table: sai ua, the herb-packed pork sausage; nam prik noom, roasted green chilli dip eaten with sticky rice and pork crackling; gaeng hung lay, a Burmese-style pork curry sweet with tamarind. At the Chang Phueak gate, a famous stall simmers whole pork legs in soy and five spice from morning until it sells out, which is usually early."],media:[{type:"image",src:"https://images.pexels.com/photos/28543545/pexels-photo-28543545.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Crisp egg noodles in curry broth, the shape khao soi takes",alt:"Noodle soup with crispy topping in a floral bowl",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/38492176/pexels-photo-38492176.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Grilled sausages on banana leaf, close kin to sai ua",alt:"Grilled sausages on skewers laid over banana leaves",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/28907751/pexels-photo-28907751.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"A noodle bowl with herbs and lime",alt:"Asian noodle bowl with fresh herbs and citrus",ratio:"aspect-[16/9]",stock:!0}],quote:{text:"The sides are not optional: pickled greens cut the cream, lime cuts the heat.",who:"How it is eaten"},margin:"Sai ua, nam prik noom, gaeng hung lay: the rest of the northern table.",tone:"paper",layout:"right"},{id:"craft",time:"14:00",thai:"งานฝีมือ",roman:"ngan fimeu",title:"The city that never stops making things by hand",dek:"The factories came and went. The hands stayed.",body:["Chiang Mai's afternoons belong to the workshops. South of the city, Baan Tawai is a village of woodcarvers: garudas, temple panels, teak elephants in every size, dust hanging in the light. East on the Sankamphaeng road, Bo Sang paints paper umbrellas and fans in pink and green, and the silk weavers of San Kamphaeng still run their looms.","In the old city, Wua Lai Road hammers silver, and beyond the moat the celadon kilns fire jade-green glaze the color of the moat itself. The hands were always the point. A mountain town, far from the ports, had to make everything it wanted: so it learned to make everything beautifully."],media:[{type:"image",src:"https://images.pexels.com/photos/32388091/pexels-photo-32388091.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Painting a paper umbrella in a workshop",alt:"Artisan focused on crafting a traditional umbrella",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/19208266/pexels-photo-19208266.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Hand-carved panels on a workbench",alt:"Hand-carved decorative wooden panels in a workshop",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/7167019/pexels-photo-7167019.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"A jeweler's torch at work, the sound of Wua Lai",alt:"Jeweler using a torch to craft a ring",ratio:"aspect-[16/9]",stock:!0}],quote:{text:"Baan Tawai: a whole village of carvers, one long street of shavings.",who:"South of the moat"},margin:"Bo Sang, Baan Tawai, Wua Lai, San Kamphaeng: the craft belt rings the city.",tone:"parchment",layout:"left"},{id:"moat",time:"16:00",thai:"คูเมือง",roman:"khu mueang",title:"The square that holds the city",dek:"A moat dug in 1296, still on duty.",body:["King Mangrai picked the plain between the river and the mountain and named his capital the New City: Chiang Mai. Legend says he planned the layout with two fellow kings, Ramkhamhaeng of Sukhothai and Ngam Muang of Phayao; their statues still stand at the center of town. Around the new city they dug a moat and raised walls, a square of roughly a mile per side.","Inside that square: more than three hundred wats, the giant broken chedi of Wat Chedi Luang, which sheltered the Emerald Buddha from 1468 to 1551, and the Inthakin city pillar that the city still honors every year. Five gates opened the walls; Tha Phae means raft landing, because goods came up from the Ping. The walls are mostly gone now. The moat has never left its post: about six kilometers around, it is the city's calmest road, joggers at dawn, monks at dusk, water that has held the Rose of the North for seven centuries."],media:[{type:"image",src:"https://images.pexels.com/photos/36020575/pexels-photo-36020575.png?auto=compress&cs=tinysrgb&fit=crop&h=800&w=1200",caption:"The great chedi of Wat Chedi Luang, old city, Chiang Mai",alt:"Historic Wat Chedi Luang temple with colorful flags in Chiang Mai",ratio:"aspect-[4/3]"},{type:"image",src:"https://images.pexels.com/photos/36768216/pexels-photo-36768216.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"A Buddha head among old bricks, Chiang Mai",alt:"Serene Buddha head amidst ancient bricks and ruins in Chiang Mai",ratio:"aspect-[4/3]"}],quote:{text:"Nopburi Si Nakhon Ping Chiang Mai: the ceremonial name, city of good omen on the Ping.",who:"The founding chronicle"},margin:"The moat is the city's calendar: lotus in July, lanterns in November, water fights in April.",tone:"paper",layout:"wide"},{id:"bazaar",time:"19:00",thai:"ถนนคนเดิน",roman:"thanon khon doen",title:"Market dusk, early bedtime",dek:"The festival city that sleeps early.",body:["When the heat breaks, the bazaar takes over Chang Khlan Road: silk, silver, souvenirs, smoke from a hundred grills. On Sunday, Tha Phae Road closes to cars and becomes a walking street, stalls spilling from the gate; on Saturday, Wua Lai does the same among the silversmiths. Eat from the grills: sai ua, pork skewers, kanom krok coconut cups, and mango sticky rice for the road.","Then notice the hour. By ten the vendors are packing; by eleven the streets are nearly empty. Chiang Mai throws the biggest festivals in the north and still goes to bed early. The city keeps its own hours, and it expects you to keep them too."],media:[{type:"image",src:"https://images.pexels.com/photos/31886133/pexels-photo-31886133.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Grilled skewers at a night market",alt:"Street food market with grilled skewers at night",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/32223212/pexels-photo-32223212.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Night market food stalls in full swing",alt:"Crowded night market with food stalls",ratio:"aspect-[4/3]",stock:!0}],quote:{text:"By ten the packing begins. A festival city that sleeps early on purpose.",who:"The nightly rhythm"},margin:"Sunday: Tha Phae walking street. Saturday: Wua Lai. The week builds toward the weekend.",tone:"parchment",layout:"right"},{id:"lantern",time:"21:00",thai:"ยี่เป็ง",roman:"yi peng",title:"November: the sky lets go",dek:"On the full moon of the twelfth lunar month, Chiang Mai lights the sky.",body:["Yi Peng is the Lanna festival of lanterns: khom loi, paper balloons the size of people, each carrying a small flame and a wish, released by the thousand from temples, bridges, and back gardens. They rise slowly and catch the wind, until the whole valley seems to be exhaling light. On the same night the city floats krathong, little rafts of banana leaf and candle, on the moat and the Ping, and the water carries its own small fires.","It is the oldest kind of spectacle: fire, paper, faith, and a sky let loose. Watch from the moat at Tha Phae, or from a rooftop in the old city, and you will understand why the people who live here forgive the smoke season, the traffic, everything: they get November."],media:[{type:"video",src:"https://videos.pexels.com/video-files/4169131/4169131-hd_1920_1080_25fps.mp4",poster:"https://images.pexels.com/videos/4169131/pexels-photo-4169131.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200",caption:"Sky lanterns rising at night",alt:"Video of glowing sky lanterns drifting upward in the dark",ratio:"aspect-[16/9]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/10034809/pexels-photo-10034809.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"A crowd under a lantern-lit sky",alt:"People gathered under a sky filled with glowing lanterns",ratio:"aspect-[4/3]",stock:!0},{type:"image",src:"https://images.pexels.com/photos/9807607/pexels-photo-9807607.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=700&w=1100",caption:"Letting a khom loi go",alt:"A child releasing a glowing lantern into the night sky",ratio:"aspect-[4/3]",stock:!0}],quote:{text:"Khom loi: a candle in a paper bag of hot air. The wish goes up with it.",who:"Yi Peng, twelfth lunar month"},margin:"The rest of the year keeps its own fires: see the calendar below.",tone:"night",layout:"left"}],y0="Four dates to plan around. The festival calendar follows the moon, not the spreadsheet; check the full moon before you book.",g0=[{month:"Kumphaphan",gregorian:"February",name:"Flower Festival",thai:"เทศกาลดอกไม้",note:"The first weekend: floats of blooms circle the moat, and the Rose of the North shows off."},{month:"Mesayon",gregorian:"April 13 to 15",name:"Songkran",thai:"สงกรานต์",note:"The water new year. The moat road becomes the biggest water fight in the north; nothing stays dry."},{month:"Phruetsaphakhom",gregorian:"Late May or June",name:"Inthakin",thai:"อินทขิล",note:"Seven days at Wat Chedi Luang for the city pillar: candles, chanting, and offerings to the spirit that holds the city."},{month:"Phruetsachikayon",gregorian:"Usually November",name:"Yi
