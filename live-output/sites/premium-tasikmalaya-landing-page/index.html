its top in 1982 and filled the wound with a green crater lake. Its ash cloud once reached 11 kilometres into the night - high enough that a Boeing 747 flew straight through it, lost all four engines, glided in silence for thirteen minutes, and restarted them above the Indian Ocean. The mountain that grounded a jumbo now hosts campers, hot springs and a lake the colour of old jade.",truth:"Cipanas, at its foot, has been soaking Priangan pilgrims in hot spring water since before anyone kept records.",media:{kind:"image",src:Jt.galunggung,alt:"A green crater lake inside a volcanic rim, ringed by dark slopes"},aspect:"aspect-[3/4]",offset:"lg:mb-24"},{num:"02",nameSunda:"ᮊᮂపᮥᮀ ᮔᮌ",name:"Kampung Naga",roman:"Kam-pung Na-ga",epithet:"The Village That Refused the Century",tag:"ADAT VILLAGE · 32 KM",stat:"no electricity · no concrete · no argument",copy:"A Sundanese adat village folded into a river bend, where a few hundred people live in bamboo houses lashed together without a single nail. No power lines cross its boundary. The rice calendar, the weaving and the rituals run exactly as they did before the Dutch arrived. Modernity is welcome to watch from the ridge - the village has its own pace.",truth:"The path down is a steep stone stairway. Take it slowly; the village has been waiting a long time.",media:{kind:"image",src:Jt.naga,alt:"Traditional bamboo houses with thatched roofs in a lush green village"},aspect:"aspect-[4/3]",offset:"lg:mt-24 lg:mb-12"},{num:"03",nameSunda:"ᮞᮤᮒᮥ ᮌᮨᮓᮦ",name:"Situ Gede",roman:"Si-tu Ge-de",epithet:"The City's Still Heart",tag:"LAKE · 8 KM · 47 HA",stat:"six metres deep, with an island called Nusa",copy:"A natural lake inside the city limits - 47 hectares of water that arrived, locals say, when a mountain above it let go. A small island named Nusa floats in the middle, a forest crowds the shore, and rowboats do the slow maths of a Sunday. This is where Tasikmalaya goes when the city gets too loud for itself.",truth:"Take a boat at six in the morning. The mist lifts off the water like the city exhaling.",media:{kind:"image",src:Jt.situdede,alt:"A calm lake with a traditional stilt house on its shore"},aspect:"aspect-[3/4]",offset:"lg:mb-24"},{num:"04",nameSunda:"ᮎᮤᮕᮒᮥᮏᮂ",name:"Cipatujah",roman:"Ci-pa-tu-jah",epithet:"Where Java Meets the Southern Ocean",tag:"SOUTH COAST · 55 KM",stat:"black sand, big surf, the Indian Ocean",copy:"The south coast of Java is where the island stops being polite. At Cipatujah and neighbouring Karang Tawulan, dark volcanic sand meets an ocean that has crossed the whole planet to get here. Sunsets arrive like an event, the surf reads as a threat to the uninitiated, and the fishermen launch their boats on schedules the rest of us are not on.",truth:"Swim where the locals swim. The riptide here does not negotiate.",media:{kind:"video",src:Jt.wavesVideo,poster:Jt.wavesPoster,alt:"Aerial film of heavy ocean waves rolling toward a dark coast"},aspect:"aspect-[16/10]",offset:"lg:mt-24 lg:mb-12"},{num:"05",nameSunda:"ᮎᮥᮛᮥᮌ᮪ ᮓᮦᮀᮓᮦᮀ",name:"Curug Dengdeng",roman:"Cu-rug Deng-deng",epithet:"The Curtain Calls",tag:"HIGHLAND FALLS · 18 KM",stat:"one of a dozen waterfalls the city keeps in its pocket",copy:"Curug - the Sundanese word for waterfall, and the Priangan is full of them. Curug Dengdeng and Curug Badak drop out of the tea-green highlands into pools that stay cold even at noon. The climb is short, the sound is enormous, and the mist keeps the ferns happy all year.",truth:"Weekday mornings belong to you. The weekend crowds find the pools by ten.",media:{kind:"video",src:Jt.fallsVideo,poster:Jt.fallsPoster,alt:"Aerial film of a waterfall cascading through dense green jungle"},aspect:"aspect-[16/10]",offset:"lg:mb-24"},{num:"06",nameSunda:"ᮙᮞ᮪ᮏᮤᮓ᮪ ᮃᮌᮥᮀ",name:"Masjid Agung",roman:"Mas-jid A-gung",epithet:"The City's Compass",tag:"GRAND MOSQUE · CITY CENTRE",stat:"five adhan calls a day, and the whole city keeps time",copy:"The Grand Mosque anchors the city the way the volcano anchors the horizon. Five times a day the adhan pours over the alun-alun - the town square - and the traffic of Tasikmalaya politely rearranges itself around prayer. For visitors, it is the easiest door into the Kota Santri: stand at the edge of the square at maghrib and watch a whole city pause at once.",truth:"The square comes alive after Isya - the night market is where the city actually talks.",media:{kind:"image",src:Jt.masjid,alt:"A large congregation praying together inside a grand mosque"},aspect:"aspect-[3/4]",offset:"lg:mt-24"}],ma=[{sunda:"ᮕᮚᮥᮀ ᮌᮩᮜᮤᮞ᮪",roman:"Payung Geulis",en:"The Beautiful Umbrella",body:"The icon of the city - a bamboo-frame umbrella covered in hand-painted paper or cloth. Made for weddings, parades and honour; its golden era ran 1955–1968, and the 1980s revival never stopped. A city regulation even requires every hotel and office doorway to carry one.",media:{kind:"image",src:Jt.payung,alt:"Traditional hand-painted paper umbrellas with floral designs"}},{sunda:"ᮘᮒᮤᮊ᮪",roman:"Batik Tasikmalaya",en:"Batik of the Priangan",body:"Wax and dye, drawn by hand with the canting - the fine spout that drips molten wax into patterns. Tasik's batik leans on natural motifs: the cangkurileung songbird, paddy, the umbrella itself. Some workshops still make it the slow way, from first sketch to final rinse.",media:{kind:"video",src:Jt.batikVideo,poster:Jt.batikPoster,alt:"Hands working wax onto fabric with a canting tool"}},{sunda:"ᮊᮩᮜᮧᮙ᮪ ᮌᮩᮜᮤᮞ᮪",roman:"Kelom Geulis",en:"The Painted Sandal",body:"Carved wooden clogs, sanded until they glow and painted with flowers and birds - once the everyday shoe of the Sundanese, now a collector's piece. Alongside the city's embroidery (bordir) and woven mendong reed, they round out the workshop lanes of Tasik.",media:{kind:"image",src:Jt.loom,alt:"Close-up of a craftsperson's hand working a traditional loom"}}],wE=[{time:"04:30",label:"Subuh - the first call, the city wakes in the dark"},{time:"12:00",label:"Lohor - the market pauses, the rice waits"},{time:"15:15",label:"Asar - workshops put the brushes down"},{time:"18:00",label:"Maghrib - the square fills, the day closes"},{time:"19:15",label:"Isya - the night market opens for business"}],NE=[{sunda:"Wilujeng sumping",roman:"Wi-lu-jeng sum-ping",en:"Welcome - come in, safely arrived.",note:"The Sundanese greeting for guests. Say it at every doorway."},{sunda:"Punten",roman:"Pun-ten",en:"Excuse me - permission to pass.",note:"The most useful word in Sundanese. Use it to enter, to leave, to exist politely."},{sunda:"Nuhun",roman:"Nu-hun",en:"Thank you.",note:"Short, warm, and it goes a long way at every warung."},{sunda:"Geulis pisan!",roman:"Geu-lis pi-san!",en:"Very beautiful!",note:"The highest praise. Say it about the umbrellas. Say it about everything."}],DE=[{sunda:"ᮔᮞᮤ ᮒᮥᮒᮥᮌ᮪ ᮇᮔ᮪ᮎᮧᮙ᮪",name:"Nasi Tutug Oncom",roman:"Na-si Tu-tug On-com",tag:"Uleg · the signature",tone:"uleg",copy:"Warm rice pounded together with orange fermented oncom and a sharp breath of kencur - aromatic ginger. The dish that defines Tasikmalaya the way rendang defines Padang: humble, loud, and impossible to forget. Eat it with fried chicken and sambal, and thank the tukang later.",media:{kind:"image",src:Jt.tutug,alt:"Traditional Indonesian street food laid out at a market stall"}},{sunda:"ᮊᮥᮕᮒ᮪ ᮒᮠᮥ",name:"Kupat Tahu",roman:"Ku-pat Ta-hu",tag:"Tumpukan · the lunch",tone:"kuyup",copy:"Rice cakes, fried tofu, bean sprouts and a peanut sauce the colour of galendo, stacked into the city's default lunch. Every warung guards its own sauce recipe like a family secret - because it is.",media:{kind:"image",src:Jt.vendor,alt:"A street vendor carrying a tray of local delicacies"}},{sunda:"ᮞᮧᮒᮧ ᮕᮒᮁᮥᮙᮔ᮪",name:"Soto Pataruman",roman:"So-to Pa-ta-ru-man",tag:"Kuyup · the street legend",tone:"kuyup",copy:"A broth so famous it named itself after its street. Soto Pataruman is beefy, turmeric-gold, and served from dawn until the pot runs dry. The queue is part of the recipe.",media:{kind:"image",src:Jt.garut,alt:"A bustling street food market with vendors and food carts"}},{sunda:"ᮎᮧᮜᮦᮔᮊ᮪",name:"Colenak",roman:"Co-le-nak",tag:"Bakar · the invention",tone:"bakar",copy:"Grilled cassava dipped in palm sugar and grated coconut. The name is a folk contraction of dicocol énak - 'dip it, delicious' - and Tasikmalaya claims it as its own invention, which the rest of West Java politely disputes. Try it hot.",media:{kind:"image",src:Jt.fried,alt:"Traditional Indonesian street food being fried at a stall"}},{sunda:"ᮌᮜᮦᮔ᮪ᮓᮧ",name:"Galendo",roman:"Ga-len-do",tag:"Manis · the maker's share",tone:"manis",copy:"What is left when palm sugar is boiled down - a dense, smoky, faintly bitter candy. Sugar makers used to keep it for themselves; now the whole island wants it. Tastes like the sap of the sugar palm and the patience of the kettle.",media:{kind:"image",src:Jt.snacks,alt:"A variety of traditional Indonesian snacks on display"}},{sunda:"ᮇᮕᮊ᮪",name:"Opak & Rengginang",roman:"O-pak · reng-gi-nang",tag:"Goréng · the crackers",tone:"goreng",copy:"Opak is baked, not fried - glutinous rice crackers from the ketan that Tasikmalaya turns into a small industry. Rengginang is its fried cousin, loud in the mouth. Both travel well, which is why every car leaving the city carries a bag.",media:{kind:"image",src:Jt.market,alt:"A traditional Indonesian market scene with vendors"}}],yy=[{time:"04:30",title:"Subuh at the square",place:"Masjid Agung · ᮙᮞ᮪ᮏᮤᮓ᮪ ᮃᮌᮥᮀ",note:"Arrive before the first call and watch the city switch itself on - warung lights, motorbikes, the muezzin's voice over everything."},{time:"06:00",title:"The morning market",place:"Pasar Induk · ᮕᮞᮁ",note:"Tutug oncom and kopi tubruk at a stall where the regulars know each other by name. Buy a kilo of opak for later."},{time:"08:00",title:"The umbrella lanes",place:"Payung Geulis workshop · ᮕᮚᮥᮀ ᮌᮩᮜᮤᮞ᮪",note:"Watch a bamboo frame become a painted umbrella in forty minutes of quiet hands. If they
