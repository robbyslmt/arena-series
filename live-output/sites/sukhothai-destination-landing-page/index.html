ds there is rice."},{face:"Second face",voice:"The kingdom, described from outside",text:"Whoever wants to trade in elephants, horses, silver or gold, trades. A bell hangs at the gate: anyone with a grievance rings it and the king comes out to hear the case. West of the city are the forest monasteries; in the sugar-palm grove a stone throne where the king sits to hear the monks preach on holy days, and to rule on other days."},{face:"Third face",voice:"The city's fixtures",text:"The Mahathat with its relics, the shrines, the ponds, the stone throne called Manangkhasila; the reliquaries and the images of gold; the monks and their teachers; and Si Satchanalai up the river with its own great chedi. A gazetteer of a capital that had existed for two generations."},{face:"Fourth face",voice:"Added, most scholars think, a little later",text:"The boundaries of the realm in every direction and the towns that paid tribute; the king's fame, in so many words; and the statement that in a year of the goat the king set his mind to devising these Thai letters, because before that they did not exist."}];function Dp(){return o.jsx("section",{id:"stone","aria-labelledby":"stone-heading",className:"relative border-t hairline px-5 py-24 md:px-8 md:py-36",children:o.jsxs("div",{className:"mx-auto max-w-[1100px]",children:[o.jsxs("div",{className:"text-center",children:[o.jsx("h2",{id:"stone-heading",className:"font-display display-tight text-[clamp(2.6rem,6vw,5.4rem)] font-medium text-ink reveal",children:"Four faces of a grey stone."}),o.jsx("p",{className:"mx-auto mt-8 measure text-[1.05rem] leading-relaxed text-ink-2 reveal",children:"In 1833 the prince who would become King Mongkut, then a monk on pilgrimage, found a four-sided pillar of dark siltstone among the ruins and had it carried to Bangkok. It is now called Inscription One, or the Ramkhamhaeng inscription, and it is traditionally dated to about 1292. It is regarded as the oldest known text in the Thai script, and the letters
