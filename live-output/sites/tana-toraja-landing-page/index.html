<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An upland almanac for Tana Toraja, the highland country of South Sulawesi: tongkonan villages, cliff graves and tau-tau effigies, the Rambu Solo' cycle, the Ma'nene' ritual, wet-rice terraces and Toraja Arabica coffee."

    <title>Tana Toraja · An Upland Almanac</title>

            t === "light" ? "light" : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
