 begins. A weaver should not float the cost of a season on household rice."},{line:"Binding",when:"When the frame is full",text:"The slowest thinking in the craft is the tying. We pay for a bound warp as work, even if the vat later disappoints."},{line:"The vat",when:"After colour has settled",text:"Dyeing is its own labour and its own risk. A soured indigo or a weak kombu is not treated as a weaver's debt."},{line:"The loom",when:"When the cloth is cut from the beam",text:"Weaving is the last invoice, not the only one. Body tension, time on the mat, and the finishing wash are named as work."},{line:"Refusal",when:"Always available",text:"A ceremonial cloth can be kept. A reserved motif can be withheld. The house does not argue a weaver into selling what her family still needs to wear or to give."},{line:"Speed",when:"Not purchased",text:"We do not place rush orders against a feast calendar. If a cloth is wanted for a date, we say no unless the warp is already mid-journey."}];function zy(){return f.jsx("section",{id:"ledger",className:"relative z-10 border-t border-line px-5 py-28 md:px-10 md:py-40",children:f.jsxs("div",{className:"grid gap-16 lg:grid-cols-12",children:[f.jsxs("div",{className:"lg:col-span-4",children:[f.jsx("p",{className:"kicker mb-4",children:"Fair trade, without a badge"}),f.jsx("h2",{className:"display text-5xl text-ink md:text-6xl",children:"The ledger is the ethics"}),f.jsxs("div",{className:"mt-8 space-y-5 font-body text-xl leading-[1.7] text-ink",children:[f.jsxs("p",{children:["For a long time the economics of ",f.jsx("em",{children:"tenun"})," ran in reverse of the labour. Months of spinning, binding, and dyeing were invisible. Only the folded cloth had a price, and that price was set by a man with a truck."]}),f.jsx("p",{className:"text-muted",children:"Paying fairly is not a slogan on our wrapping. It is a change in when money moves. Once payment arrives during the work, daughters can stay at the frame. Once it arrives only at the end, places will take indigo, or kombu red, or both, depending on the sequence of baths. Complex cloths are bound, dyed, rebound, and dyed again.","Ikat means to bind. The slightly feathered edge that people admire later is only the dye creeping under a knot that was never machine-tight. The blur is not a style. It is the honesty of the hand."]},{verb:"Dip",term:"Pewarna alam",translation:"natural dye",image:"images/kombu-vat.jpg",alt:"A clay pot of deep rust-red dye made from roots and bark.",caption:"A kombu vat. Red from the root of mengkudu, Morinda citrifolia.",body:["Blue comes from the leaves of nila or woru, Indigofera tinctoria, fermented in water with candlenut and lime. The vat looks dead until the air touches it. Then a copper bloom forms, and the yarn, lifted out greenish, turns blue in the hand.","Red, called kombu, is boiled from the root of mengkudu. It is slower than indigo and greedier. Yellow can be taken from turmeric or from the bark some dyers call kayu kuning. Black is often a mud bath after tannin. Layering these baths is how a hinggi kombu earns its name.","A single dip is only a stain. Depth comes from returning to the vat, drying, and returning again. We do not publish a count of dips. The cloth is ready when the dyer says the colour has settled, not when a calendar says so."]},{verb:"Weave",term:"Tenun",translation:"to weave",image:"images/loom-tension.jpg",alt:"Taut warp on a back-strap loom, wooden sword and heddle in working position.",caption:"Warp under body tension. The back-strap loom has no standing frame. The weaver is the frame.",body:["After the last bath the bindings come off. The pattern is already in the yarn, a ghost of the cloth. The warp is arranged on a loom of bamboo and wood, the far beam tied to a house post, the near beam strapped around the weaver's back.","Sumbanese cloth is warp-faced. There are more threads running the length than across. The weaver opens a shed with the heddle, passes the weft, beats it home with a wooden sword. Her weight keeps the tension honest. A shift of the hips is a change in the cloth.","Weaving is the last of the long stages, not the first. Visitors often photograph only this, because it looks like making. The making began when the cotton was still seed."]}];function Dy(){return f.jsxs("section",{id:"process",className:"relative z-10 border-t border-line",children:[f.jsxs("div",{className:"px-5 py-20 md:px-10 md:py-28",children:[f.jsx("p",{className:"kicker mb-4",children:"The work, in order"}),f.jsx("h2",{className:"display max-w-4xl text-5xl text-ink md:text-7xl",children:"The pattern is decided while the cloth does not exist"})]}),f.jsx("div",{className:"space-y-0",children:Oy.map((b,H)=>f.jsx("article",{className:"border-t border-line px-5 py-20 md:px-10 md:py-28",children:f.jsxs("div",{className:`grid items-start gap-12 lg:grid-cols-12 ${H%2===1,""}`,children:[f.jsxs("div",{className:`lg:col-span-5 ${H%2===1?"lg:col-start-8":""}`,children:[f.jsx("p",{className:"kicker mb-3",children:b.term}),f.jsx("h3",{className:"display text-6xl text-ink md:text-8xl",children:b.verb}),f.jsx("p",{className:"mt-3 font-body italic text-muted",children:b.translation}),f.jsxs("figure",{className:"mt-10",children:[f.jsx("div",{className:"img-frame aspect-[5/4]",children:f.jsx("img",{src:b.image,alt:b.alt,width:1600,height:1280,loading:"lazy"})}),f.jsx("figcaption",{className:"caption mt-3",children:b.caption})]})]}),f.jsx("div",{className:`lg:col-span-6 ${H%2===1?"lg:col-start-1 lg:row-start-1":"lg:col-start-7"}`,children:f.jsx("div",{className:"measure space-y-5 font-body text-xl leading-[1.7] text-ink",children:b.body.map(E=>f.jsx("p",{children:E},E.slice(0,40)))})})]})},b.verb))}),f.jsxs("div",{className:"grid gap-0 border-t border-line md:grid-cols-3",children:[f.jsxs("figure",{className:"border-b border-line md:border-b-0 md:border-r",children:[f.jsx("div",{className:"img-frame aspect-[4/3]",children:f.jsx("img",{src:"images/indigo-yarn.jpg",alt:"Freshly dyed ind
