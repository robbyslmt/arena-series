s&cs=tinysrgb&w=1800",torajaLand:"https://images.pexels.com/photos/4090324/pexels-photo-4090324.jpeg?auto=compress&cs=tinysrgb&w=1800",bajawaLand:"https://images.pexels.com/photos/2166643/pexels-photo-2166643.jpeg?auto=compress&cs=tinysrgb&w=1800",wamenaLand:"https://images.pexels.com/photos/2819353/pexels-photo-2819353.jpeg?auto=compress&cs=tinysrgb&w=1800",harvest:"https://images.pexels.com/photos/30717831/pexels-photo-30717831.jpeg?auto=compress&cs=tinysrgb&w=1800",sorting:"https://images.pexels.com/photos/29812652/pexels-photo-29812652.jpeg?auto=compress&cs=tinysrgb&w=1800",handsBeans:"https://images.pexels.com/photos/17060529/pexels-photo-17060529.jpeg?auto=compress&cs=tinysrgb&w=1600",drying:"https://images.pexels.com/photos/17366133/pexels-photo-17366133.jpeg?auto=compress&cs=tinysrgb&w=1800",drum:"https://images.pexels.com/photos/4820676/pexels-photo-4820676.jpeg?auto=compress&cs=tinysrgb&w=1800",panel:"https://images.pexels.com/photos/4820811/pexels-photo-4820811.jpeg?auto=compress&cs=tinysrgb&w=1600",green:"https://images.pexels.com/photos/4815898/pexels-photo-4815898.jpeg?auto=compress&cs=tinysrgb&w=1600",roasted:"https://images.pexels.com/photos/30444143/pexels-photo-30444143.jpeg?auto=compress&cs=tinysrgb&w=1600",pour:"https://images.pexels.com/photos/20513594/pexels-photo-20513594.jpeg?auto=compress&cs=tinysrgb&w=1600",v60:"https://images.pexels.com/photos/29619140/pexels-photo-29619140.jpeg?auto=compress&cs=tinysrgb&w=1600",press:"https://images.pexels.com/photos/16444384/pexels-photo-16444384.jpeg?auto=compress&cs=tinysrgb&w=1600"},x0=[{name:"1500m Coffee",note:"cherries, harvest, sorting"},{name:"Daniel Reche",note:"ripening branch"},{name:"Mike Panton",note:"highland mist"},{name:"Tom Fisk",note:"volcanic highland"},{name:"Tomáš Malík",note:"valley and volcano"},{name:"Atlantic Ambience",note:"volcano and forest"},{name:"Muhammad Syahroyni",note:"sunrise ridge"},{name:"Susan Flores",note:"hands at the seed"},{name:"Imanishimwe regis",note:"raised-bed drying"},{name:"cottonbro studio",note:"drum and control panel"},{name:"Nguyễn Tiến Thịnh",note:"roaster shell"},{name:"Jimmy Ramírez",note:"cooling drum"},{name:"Maksim Goncharenok",note:"green seed"},{name:"Ignacio Vazquez",note:"roasted seed"},{name:"Brunxs",note:"pour-over bed"},{name:"Israyosoy S.",note:"dripper and kettle"},{name:"Dextar Studio",note:"immersion brew"},{name:"Kampus Production",note:"soil in hand"}],Ju=[{id:"gayo",name:"Gayo",island:"Sumatra",region:"Gayo highlands, Central Aceh",coords:"4.62 N · 96.85 E",altitude:"1,100 to 1,600 masl",process:"Wet-hulled",processLocal:"giling basah",varieties:"Ateng, Tim-Tim, local Typica lines",harvest:"October through March, main flush",soil:"Volcanic highland, humid",density:3.4,moisture:4.2,recCharge:206,recDtr:21,cup:["cedar","dark chocolate","dried plum","tobacco leaf","forest floor"],lead:"The humidity of Aceh is not a defect. It is written into the seed.",body:["Takengon sits in a bowl of highland. The Gayo people farm small plots on volcanic slopes where the air stays wet long after the rain has moved on. Most lots we take are giling basah, wet-hulled: the parchment, kulit tanduk, is stripped while the seed still holds a third of its water. The bean finishes drying naked. That is why the cup is heavy, low in acid, and why drinkers raised on washed coffee call it earthy as if that were an insult.","We do not roast the earth out of Gayo. We roast so cedar and dark chocolate can stand next to it. Charge hotter than a washed lot. Give the water time to leave before Maillard starts writing. First crack will sound duller than Kintamani. Listen anyway. If you charge it like a washed Central American, the turning point drags and the chocolate bakes into cardboard.","The finish is long and warm. Pahit-manis, bitter-sweet, in the honest sense: not a slogan, a structure. Ampas, the spent grounds, will still smell of cedar an hour later. That is how you know the dry phase did its work."],brewHint:"Immersion. French press or a cupping bowl. Coarse. Water at 94 C. Ratio 1:15. The oils want time in the slurry. A fast V60 will thin the body and leave you with cedar and not much else.",image:Se.gayoLand,imageAlt:"Mist held in a forested highland valley at dawn",imageCredit:"Mike Panton"},{id:"kintamani",name:"Kintamani",island:"Bali",region:"Kintamani highlands, between Batur and Agung",coords:"8.24 S · 115.33 E",altitude:"900 to 1,500 masl",process:"Fully washed",processLocal:"proses cuci penuh",varieties:"Typica, Bourbon, Catimor",harvest:"May through September",soil:"Entisol and Inceptisol on Batur ash",density:3.1,moisture:2.2,recCharge:196,recDtr:18,cup:["lemon pith","white flower","green apple","light cocoa","clean finish"],lead:"The lemon in the cup is not a tasting-note fantasy. It is the orchard next to the tree.",body:["Kintamani is a cool plateau and a set of slopes above nine hundred metres. It was the first Indonesian coffee to carry a geographical indication, registered in 2008. Farmers work inside Subak Abian, a temple-irrigation order built on Tri Hita Karana: right relation to the gods, to other people, and to the ground. Coffee is grown in tumpang sari, intercropped with citrus, chili, and other food. The lemon you taste is agriculture, not a flavorist.","This is washed coffee. Selective red-cherry picking is the habit, not a brochure line. The cup is clean, medium in body, medium to high in acidity, and almost free of the forest-floor note that defines wet-hulled Sumatra. Charge cooler than Gayo. Keep development short. Stretch Maillard too long and you caramelize the citrus into candy. You will have a pleasant roast and you will have lost Bali.","We roast Kintamani when we need to remember that Indonesia is not one island and not one process. Biji from here want a drum that does not shout."],brewHint:"V60. Medium-fine. Water at 92 C. Ratio 1:16.5. Fast, even pours. You are chasing lemon and flower, not weight. If the cup goes bitter, you over-extracted a washed lot that was never meant to be stewed.",image:Se.kintamaniLand,imageAlt:"A volcanic peak standing above cloud and cultivated highland",imageCredit:"Tom Fisk"},{id:"toraja",name:"Toraja",island:"Sulawesi",region:"Tana Toraja, South Sulawesi",coords:"2.97 S · 119.90 E",altitude:"1,200 to 1,800 masl",process:"Washed and wet-hulled lots",processLocal:"cuci dan giling basah",varieties:"Typica, S795, local hybrids",harvest:"April through July",soil:"Mildly acid volcanic highland",density:3.6,moisture:3.1,recCharge:202,recDtr:22,cup:["dark chocolate","dried fig","cedar","warm spice","syrup body"],lead:"Once sold as Celebes. The land did not change when the name did.",body:["Tana Toraja is high valley and ridge. Some of the oldest coffee tradition in the archipelago lives here. Lots still arrive under the old trade name Kalosi, and older cups still say Celebes. Typica and S795 show up in what we buy. Density is honest. The climate is wet. The cup, when the process is clean, is why people who think they hate Indonesian coffee change their minds.","Washed Toraja is chocolate, dried fig, cedar, a creamy weight. Spice without smoke. Wet-hulled Toraja leans earthier and heavier, closer to Gayo but with more structure. We stretch Maillard here. The chocolate needs time to form. Do not rush the browning phase just to land a pretty first crack on the clock.","If the rate of rise collapses before the crack, the fig turns to baked raisin and the spice goes dusty. Keep the RoR declining, never dead. Drop before second crack even thinks about speaking."],brewHint:"Kalita Wave or a decent batch brewer. Medium grind. Water at 93 C. Ratio 1:16. The flat bed forgives the chocolate and keeps the spice from spiking. Espresso works if you respect the dose and do not chase a blonding that is not coming.",image:Se.torajaLand,imageAlt:"A volcano rising from a wide highland valley under broken cloud",imageCredit:"Tomáš Malík"},{id:"bajawa",name:"Bajawa",island:"Flores",region:"Ngada plateau, between Inerie and Abulobo",coords:"8.79 S · 120.96 E",altitude:"1,100 to 1,700 masl",process:"Washed, some wet-hulled",processLocal:"cuci, kadang giling basah",varieties:"S795, local Typica",harvest:"May through September",soil:"Young volcanic ash, highland plateau",density:3.2,moisture:2.6,recCharge:199,recDtr:19,cup:["cocoa","cinnamon","brown sugar","herbal flower","clean close"],lead:"The Indonesian cup that surprises people who came looking for Sumatra.",body:["Bajawa sits on a plateau between two volcanoes, Inerie and Abulobo, in Ngada country. Smallholders have grown Arabica here for generations, mostly organic by habit rather than by certificate. S795 is common. Altitude is real, often well above 1,200 metres, and the nights are cool enough to slow the cherry.","Washed Bajawa is floral and cocoa, with a cinnamon finish and a brown-sugar sweetness that does not need help from a dark roast. Wet-hulled lots pick up herb and a little more weight. The forest-floor of Aceh is mostly absent. What you get instead is a medium body and a finish clean enough for a V60 that will not go thin.","Treat it closer to a washed Central American than to a Gayo. Medium charge. Honest development. Do not bury the flower under a long drop. If first crack is sharp and even, you are on the land. If it straggles, the moisture was uneven and you should have dried longer in the drum."],brewHint:"V60 or AeroPress. Water at 93 C. Ratio 1:16. Washed lots want the Kintamani treatment with a little more weight in the cup. Wet-hulled lots can take a slightly coarser grind and a calmer pour.",image:Se.bajawaLand,imageAlt:"A forested volcano standing in humid low light",imageCredit:"Atlantic Ambience"},{id:"wamena",name:"Wamena",island:"Papua",region:"Baliem Valley, highland Papua",coords:"4.10 S · 138.95 E",altitude:"1,400 to 2,000 masl",process:"Washed, occasional natural",processLocal:"cuci, kadang natural",varieties:"Typica, Blue Mountain lines",harvest:"May through September",soil:"Old forest shade, highland valley",density:4.1,moisture:2.4,recCharge:208,recDtr:17,cup:["stone fruit","white flower","dark chocolate","almond","long clean"],lead:"Among the highest coffee in the country. Density is not a metaphor.",body:["Wamena sits in the Baliem Valley. Lots leave by air or on foot. The farms are high, often between 1,400 and 2,000 metres, under shade in old forest, with little chemistry on the ground. This is not a romance. It is logistics and altitude. The seed arrives dense. If you undercharge, the core stays bread-like while the surface colors. You will cup a pretty shell and a raw heart.","Washed Wamena can be floral and stone-fruited, with chocolate sitting underneath instead of on top. Naturals, when they are clean, push honeydew and a softer tropical. We give it heat at the start and then we are gentle after the crack. Development is short. The flower dies if you linger.","This is the lot we roast when we want to remember that Indonesia is not one flavor. Sangrai here is surveying, not branding. The drum has to climb a taller mountain."],brewHint:"V60, slightly finer than Kintamani. Water at 91 to 92 C. Ratio 1:16.5. Cooler water keeps the florals from burning off. Do not stew it. If you want more body, add a thirty-second immersion at the start, then draw down. Do not raise the temperature.",image:Se.wamenaLand,imageAlt:"Sunrise light on a long misty mountain ridge",imageCredit:"Muhammad Syahroyni"}],b0=[{name:"Mira Siregar",role:"Roast lead",local:"penyangrai",note:"Listens for first crack the way a surveyor listens for the chain. Writes every curve by hand before it is logged. Will dump a batch that smells right and sounds wrong."},{name:"Andi Palinoan",role:"Green buyer",local:"pembeli biji hijau",note:"Walks moisture and density before he walks price. Knows which wet-hulled lots will still be blue-green in the bag and which have already started to fade. Speaks Toraja at the table and Acehnese on the phone."},{name:"Sari Wonda",role:"Cupping",local:"pencicip",note:"Breaks the crust at four minutes and does not talk until the cup is cool. Translates the land back into words the rest of us can roast to. Hates the word notes when she means structure."},{name:"Ujang Ginting",role:"Mill liaison",local:"penghubung gilingan",note:"Stands in the wet mill when the parchment comes off too early. Argues for raised beds in weather that wants tarps. Sends us the truth about a lot, not the story that would sell it."}],S0=[{name:"V60",use:"Kintamani, washed Bajawa, Wamena",spec:"Medium-fine · 91 to 93 C · 1:16 to 1:16.5 · 2:30 to 3:00",why:"A fast bed keeps citrus and flower from turning into stew. Use it when the land is washed and the density is not extreme."},{name:"Kalita Wave",use:"Toraja, mixed lots",spec:"Medium · 93 C · 1:16 · 3:00 to 3:20",why:"The flat bed calms spice and lets chocolate build. Forgiving when a Sulawesi lot is a little uneven."},{name:"French press",use:"Gayo, wet-hulled Bajawa",spec:"Coarse · 94 C · 1:15 · 4:00, then decant",why:"Immersion keeps the oil and the cedar. Do not plunge hard. Decant off the ampas so the cup does not keep extracting into sludge."},{name:"AeroPress",use:"Bajawa, travel, small cups",spec:"Medium · 93 C · 1:14 inverted · 1:30 steep",why:"Short contact, clean enough, enough body for a Flores lot that sits between washed and wet-hulled."},{name:"Espresso",use:"Toraja, Gayo as a single",spec:"Fine · 93 C · 1:2.1 to 1:2.3 · 28 to 32 s",why:"We do not blend these away. A single-origin shot should still taste like the island. If it only tastes like roast, the development was too long."}],j0=[{name:"Charge",local:"masuk drum",range:"Drum 190 to 210 C",copy:"The moment the biji hit a hot drum. Charge temperature is the elevation datum. Too hot and you scorch the face of a wet-hulled seed. Too cool and a dense Wamena never cooks through. We set charge to the land, not to a house recipe."},{name:"Turning point",local:"titik balik",range:"About 60 to 90 seconds, bean probe
